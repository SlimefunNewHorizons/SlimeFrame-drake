name: Release
on:
  workflow_run:
    workflows: [Java CI]
    types: [completed]

permissions:
  contents: write

jobs:
  on-success:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}

    steps:
      - uses: actions/checkout@v4.1.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Get artifact id
        id: project
        run: |
          ARTIFACT=$(mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout)
          echo "artifact=$ARTIFACT" >> $GITHUB_OUTPUT

      - name: Conventional Changelog Action
        id: changelog
        uses: TriPSs/conventional-changelog-action@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          skip-version-file: true
          skip-commit: true
          skip-tag: true
          git-push: false
          skip-git-pull: true

      - name: Update pom.xml version and push changes
        if: steps.changelog.outputs.skipped == 'false'
        env:
          GIT_AUTHOR_NAME: JackStar6677-1
          GIT_AUTHOR_EMAIL: pablo.elias.miranda.292003@gmail.com
          GIT_COMMITTER_NAME: JackStar6677-1
          GIT_COMMITTER_EMAIL: pablo.elias.miranda.292003@gmail.com
        run: |
          mvn versions:set -DnewVersion=${{ steps.changelog.outputs.version }}
          mvn versions:commit
          git commit -am "chore(release): version ${{ steps.changelog.outputs.tag }} [skip ci]"
          git tag -a ${{ steps.changelog.outputs.tag }} -m "${{ steps.changelog.outputs.tag }}"
          git push --atomic origin HEAD:refs/heads/main --follow-tags

      - name: Generate jar
        if: steps.changelog.outputs.skipped == 'false'
        run: |
          mvn package

      - name: Create release with last commit
        if: steps.changelog.outputs.skipped == 'false'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.changelog.outputs.tag }}
          name: ${{ steps.changelog.outputs.tag }}
          body: ${{ steps.changelog.outputs.clean_changelog }}
          artifacts: "target/${{ steps.project.outputs.artifact }}-v${{ steps.changelog.outputs.version }}.jar"

  on-failure:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    steps:
      - run: echo 'The triggering workflow failed'
